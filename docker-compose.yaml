services:
  postgres:
    image: postgres:16-alpine
    container_name: onleash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: onleash
      POSTGRES_PASSWORD: onleash
      POSTGRES_DB: onleash
    ports:
      - "5432:5432"
    volumes:
      - onleash-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onleash -d onleash"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  onleash-postgres-data:
